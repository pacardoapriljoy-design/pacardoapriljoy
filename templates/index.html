
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student CRUD Management System - Lab 8</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4eafa;
            margin: 0;
            padding: 25px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h1, h2 {
            color: #80569b;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #d8c2e6;
            border-radius: 7px;
        }

        button {
            background: #80569b;
            color: white;
            padding: 11px 17px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            margin: 4px;
        }

        button:hover {
            background: #624078;
        }

        .edit {
            background: #3979b8;
        }

        .delete {
            background: #d9534f;
        }

        .cancel {
            background: #777;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            min-width: 650px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #80569b;
            color: white;
        }

        tr:nth-child(even) {
            background: #faf6fc;
        }

        .message {
            margin-top: 12px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        @media(max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            body {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student CRUD Management System</h1>

    <!-- STUDENT FORM -->
    <div class="card">

        <h2 id="formTitle">Add Student Record</h2>

        <form id="studentForm">

            <input type="hidden" id="recordId">

            <div class="form-grid">

                <input type="text" id="student_id"
                       placeholder="Student ID" required>

                <input type="text" id="name"
                       placeholder="Full Name" required>

                <input type="text" id="program"
                       placeholder="Program" required>

                <input type="number" id="year"
                       placeholder="Year" min="1" required>

                <input type="text" id="section"
                       placeholder="Section" required>

            </div>

            <button type="submit" id="submitButton">
                Add Student
            </button>

            <button type="button" class="cancel"
                    id="cancelButton"
                    onclick="resetForm()" hidden>
                Cancel
            </button>

            <div id="formMessage" class="message"></div>

        </form>

    </div>


    <!-- MY STUDENT RECORDS -->
    <div class="card">

        <h2>My Student Records</h2>

        <input type="text" id="searchInput"
               placeholder="Search student records...">

        <button onclick="loadStudents()">Refresh Records</button>

        <div id="localMessage" class="message"></div>

        <div class="table-wrapper">

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Program</th>
                        <th>Year</th>
                        <th>Section</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentTable">
                    <tr>
                        <td colspan="7">Loading records...</td>
                    </tr>
                </tbody>
            </table>

        </div>

    </div>


    <!-- CLASSMATE RECORDS -->
    <div class="card">

        <h2>Classmate's Records</h2>

        <p>Source: Classmate's Remote API (Read Only)</p>

        <input type="text" id="classmateURL"
               value="https://francineescultura-4.onrender.com"
               placeholder="Enter classmate's Render URL">

        <button onclick="loadClassmateRecords()">
            Retrieve Classmate Records
        </button>

        <div id="remoteMessage" class="message"></div>

        <div class="table-wrapper">

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Program</th>
                        <th>Year</th>
                        <th>Section</th>
                    </tr>
                </thead>

                <tbody id="classmateTable">
                    <tr>
                        <td colspan="6">
                            Click Retrieve Classmate Records.
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>

    </div>

</div>


<script>

let students = [];

// ESCAPE HTML
function safe(value) {
    const div = document.createElement("div");
    div.textContent = value ?? "";
    return div.innerHTML;
}

// MESSAGE
function message(id, text, type) {
    const element = document.getElementById(id);
    element.textContent = text;
    element.className = "message " + type;
}

// LOAD STUDENTS
async function loadStudents() {

    const table = document.getElementById("studentTable");

    table.innerHTML =
        '<tr><td colspan="7">Loading...</td></tr>';

    try {

     const response = await fetch("/partner-records");

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        students = Array.isArray(data)
            ? data
            : data.students || data.records || [];

        displayStudents(students);

        message("localMessage",
            "Records loaded successfully.", "success");

    } catch (error) {

        table.innerHTML =
            '<tr><td colspan="7">Unable to load records.</td></tr>';

        message("localMessage",
            error.message, "error");
    }
}

// DISPLAY STUDENTS
function displayStudents(data) {

    const table = document.getElementById("studentTable");

    if (!data.length) {
        table.innerHTML =
            '<tr><td colspan="7">No student records found.</td></tr>';
        return;
    }

    table.innerHTML = data.map(student => `
        <tr>
            <td>${safe(student.id)}</td>
            <td>${safe(student.student_id)}</td>
            <td>${safe(student.name)}</td>
            <td>${safe(student.program)}</td>
            <td>${safe(student.year)}</td>
            <td>${safe(student.section)}</td>
            <td>
                <button class="edit"
                    onclick="editStudent(${Number(student.id)})">
                    Edit
                </button>

                <button class="delete"
                    onclick="deleteStudent(${Number(student.id)})">
                    Delete
                </button>
            </td>
        </tr>
    `).join("");
}

// ADD OR UPDATE
document.getElementById("studentForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const id = document.getElementById("recordId").value;

    const student = {
        student_id: document.getElementById("student_id").value,
        name: document.getElementById("name").value,
        program: document.getElementById("program").value,
        year: Number(document.getElementById("year").value),
        section: document.getElementById("section").value
    };

    try {

        const response = await fetch(
            id ? `/api/students/${id}` : "/api/students",
            {
                method: id ? "PUT" : "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(student)
            }
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Unable to save student.");
        }

        message("formMessage",
            id ? "Student updated!" : "Student added!",
            "success");

        resetForm();
        await loadStudents();

    } catch (error) {

        message("formMessage", error.message, "error");

    }

});

// EDIT STUDENT
function editStudent(id) {

    const student = students.find(
        item => Number(item.id) === id
    );

    if (!student) return;

    document.getElementById("recordId").value = student.id;
    document.getElementById("student_id").value = student.student_id;
    document.getElementById("name").value = student.name;
    document.getElementById("program").value = student.program;
    document.getElementById("year").value = student.year;
    document.getElementById("section").value = student.section;

    document.getElementById("formTitle").textContent =
        "Edit Student Record";

    document.getElementById("submitButton").textContent =
        "Update Student";

    document.getElementById("cancelButton").hidden = false;

    window.scrollTo({ top: 0, behavior: "smooth" });
}

// DELETE STUDENT
async function deleteStudent(id) {

    if (!confirm("Are you sure you want to delete this student?")) {
        return;
    }

    try {

        const response = await fetch(`/api/students/${id}`, {
            method: "DELETE"
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Delete failed.");
        }

        message("localMessage",
            "Student deleted successfully!", "success");

        await loadStudents();

    } catch (error) {

        message("localMessage", error.message, "error");

    }
}

// RESET FORM
function resetForm() {

    document.getElementById("studentForm").reset();
    document.getElementById("recordId").value = "";

    document.getElementById("formTitle").textContent =
        "Add Student Record";

    document.getElementById("submitButton").textContent =
        "Add Student";

    document.getElementById("cancelButton").hidden = true;
}

// SEARCH
document.getElementById("searchInput")
.addEventListener("input", function() {

    const keyword = this.value.toLowerCase();

    const filtered = students.filter(student =>
        [
            student.id,
            student.student_id,
            student.name,
            student.program,
            student.year,
            student.section
        ].some(value =>
            String(value ?? "").toLowerCase().includes(keyword)
        )
    );

    displayStudents(filtered);
});

// CLASSMATE RECORDS
async function loadClassmateRecords() {

    const table = document.getElementById("classmateTable");

    const baseURL = document.getElementById("classmateURL")
        .value.trim().replace(/\/+$/, "");

    if (!baseURL) {
        message("remoteMessage",
            "Please enter the Render URL.", "error");
        return;
    }

    table.innerHTML =
        '<tr><td colspan="6">Retrieving records...</td></tr>';

    try {

        // Use your own Flask server-side proxy.
        const response = await fetch(
            "/partner-records?url=" +
            encodeURIComponent(baseURL + "/api/students")
        );

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const result = await response.json();

        const records = Array.isArray(result)
            ? result
            : result.students || result.records || [];

        if (!Array.isArray(records)) {
            throw new Error("Invalid API response.");
        }

        if (!records.length) {
            table.innerHTML =
                '<tr><td colspan="6">No records found.</td></tr>';
        } else {

            table.innerHTML = records.map(student => `
                <tr>
                    <td>${safe(student.id)}</td>
                    <td>${safe(student.student_id)}</td>
                    <td>${safe(student.name)}</td>
                    <td>${safe(student.program)}</td>
                    <td>${safe(student.year)}</td>
                    <td>${safe(student.section)}</td>
                </tr>
            `).join("");

        }

        message("remoteMessage",
            "Classmate records retrieved successfully!",
            "success");

    } catch (error) {

        table.innerHTML =
            '<tr><td colspan="6">Unable to load records.</td></tr>';

        message("remoteMessage",
            "Unable to retrieve classmate records: " +
            error.message, "error");
    }
}

// INITIAL LOAD
document.addEventListener("DOMContentLoaded", loadStudents);

</script>

</body>
</html>
