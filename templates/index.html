
<!DOCTYPE html>
<html>
<head>
    <title>Student API Interface</title>

    <!-- CSS DESIGN -->
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f5f7fa;
        }

        h1 {
            color: #333;
        }

        h2 {
            color: #444;
        }

        button {
            padding: 8px 14px;
            margin: 5px;
            cursor: pointer;
            background-color: #4a6fa5;
            color: white;
            border: none;
            border-radius: 4px;
        }

        button:hover {
            background-color: #345580;
        }

        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #result, #greeting, #profileResult {
            margin-top: 15px;
            padding: 10px;
            background-color: white;
            border-radius: 5px;
        }

        hr {
            margin: 25px 0;
        }
    </style>
</head>

<body>

    <h1>Student API Interface</h1>

    <!-- STUDENT INFORMATION API -->
    <button onclick="loadStudent()">
        Load Student Information
    </button>

    <div id="result"></div>

    <hr>

    <!-- GREETING API -->
    <h2>Greeting API</h2>

    <input type="text" id="nameInput"
           placeholder="Enter your first name">

    <button onclick="sayHello()">Say Hello</button>

    <p id="greeting"></p>

    <hr>

    <!-- CUSTOM STUDENT PROFILE API -->
    <h2>My Student Profile API</h2>

    <button onclick="loadMyProfile()">
        View My Profile
    </button>

    <div id="profileResult"></div>

    <script>

        // STUDENT INFORMATION API
        function loadStudent() {
            fetch('/student')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').innerHTML =
                        '<p><b>Student ID:</b> ' + data.student_id + '</p>' +
                        '<p><b>Name:</b> ' + data.name + '</p>' +
                        '<p><b>Program:</b> ' + data.program + '</p>' +
                        '<p><b>Year:</b> ' + data.year + '</p>' +
                        '<p><b>Section:</b> ' + data.section + '</p>';
                })
                .catch(error => {
                    document.getElementById('result').innerHTML =
                        '<p>Unable to retrieve data.</p>';
                });
        }

        // GREETING API
        function sayHello() {
            const name = document.getElementById('nameInput').value;

            fetch('/hello?name=' + encodeURIComponent(name))
                .then(response => response.json())
                .then(data => {
                    document.getElementById('greeting').innerText =
                        data.message;
                })
                .catch(error => {
                    document.getElementById('greeting').innerText =
                        'Unable to retrieve greeting.';
                });
        }

        // CUSTOM API: MY STUDENT PROFILE
        function loadMyProfile() {
            fetch('/my-profile')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('API request failed');
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('profileResult').innerHTML =
                        '<p><b>Student ID:</b> ' + data.student_id + '</p>' +
                        '<p><b>Name:</b> ' + data.name + '</p>' +
                        '<p><b>Program:</b> ' + data.program + '</p>' +
                        '<p><b>Year:</b> ' + data.year + '</p>' +
                        '<p><b>Section:</b> ' + data.section + '</p>' +
                        '<p><b>Favorite Language:</b> ' + data.favorite_language + '</p>' +
                        '<p><b>Hobby:</b> ' + data.hobby + '</p>' +
                        '<p><b>Goal:</b> ' + data.goal + '</p>';
                })
                .catch(error => {
                    document.getElementById('profileResult').innerText =
                        'Unable to retrieve profile.';
                });
        }

    </script>

</body>
</html>
