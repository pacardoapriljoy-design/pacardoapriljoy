
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student CRUD Management System - Lab 8</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4eaf7;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h1, h2 {
            color: #80569b;
        }

        h1 {
            text-align: center;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5c0e3;
            border-radius: 7px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 7px;
            background: #80569b;
            color: white;
            cursor: pointer;
            margin: 3px;
        }

        button:hover {
            background: #67417f;
        }

        .delete {
            background: #dc5252;
        }

        .edit {
            background: #3979b8;
        }

        .view {
            background: #399b79;
        }

        .cancel {
            background: #777;
        }

        .search-box {
            margin: 15px 0;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #80569b;
            color: white;
        }

        tr:nth-child(even) {
            background: #faf6fc;
        }

        .message {
            margin: 12px 0;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .remote-section {
            margin-top: 20px;
        }

        @media(max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            body {
                padding: 10px;
            }

            .card {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student CRUD Management System</h1>

    <!-- STUDENT FORM -->
    <div class="card">

        <h2 id="formTitle">Add Student Record</h2>

        <form id="studentForm">

            <input type="hidden" id="recordId">

            <div class="form-grid">

                <div>
                    <label>Student ID</label>
                    <input type="text" id="student_id"
                           placeholder="Enter Student ID" required>
                </div>

                <div>
                    <label>Full Name</label>
                    <input type="text" id="name"
                           placeholder="Enter Full Name" required>
                </div>

                <div>
                    <label>Program</label>
                    <input type="text" id="program"
                           placeholder="Enter Program" required>
                </div>

                <div>
                    <label>Year</label>
                    <input type="number" id="year"
                           min="1" max="5"
                           placeholder="Enter Year" required>
                </div>

                <div>
                    <label>Section</label>
                    <input type="text" id="section"
                           placeholder="Enter Section" required>
                </div>

            </div>

            <button type="submit" id="submitButton">
                Add Student
            </button>

            <button type="button" class="cancel"
                    id="cancelButton" hidden
                    onclick="resetForm()">
                Cancel Edit
            </button>

            <div id="formMessage" class="message"></div>

        </form>

    </div>


    <!-- MY STUDENT RECORDS -->
    <div class="card">

        <h2>My Student Records</h2>

        <input type="text" id="searchInput"
               class="search-box"
               placeholder="Search student ID, name, program, or section...">

        <button onclick="loadStudents()">
            Refresh Records
        </button>

        <div id="localMessage" class="message"></div>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Program</th>
                        <th>Year</th>
                        <th>Section</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentTable">
                    <tr>
                        <td colspan="7">Loading records...</td>
                    </tr>
                </tbody>

            </table>

        </div>

    </div>


    <!-- CLASSMATE RECORDS -->
    <div class="card remote-section">

        <h2>Classmate's Records</h2>

        <p>
            Source: Classmate's Remote API (Read Only)
        </p>

        <input type="text" id="classmateURL"
               value="https://francineescultura-4.onrender.com"
               placeholder="Enter classmate's Render URL">

        <button onclick="loadClassmateRecords()">
            Retrieve Classmate Records
        </button>

        <div id="remoteMessage" class="message"></div>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Program</th>
                        <th>Year</th>
                        <th>Section</th>
                    </tr>
                </thead>

                <tbody id="classmateTable">
                    <tr>
                        <td colspan="6">
                            Click Retrieve Classmate Records.
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

    let students = [];

    // ESCAPE HTML
    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);
    }


    // DISPLAY MESSAGE
    function showMessage(elementId, message, type) {
        const element = document.getElementById(elementId);
        element.textContent = message;
        element.className = "message " + type;
    }


    // LOAD STUDENTS
    async function loadStudents() {

        const table = document.getElementById("studentTable");

        table.innerHTML =
            '<tr><td colspan="7">Loading records...</td></tr>';

        try {

            const response = await fetch("/api/students");

            if (!response.ok) {
                throw new Error("HTTP Error: " + response.status);
            }

            const data = await response.json();

            students = Array.isArray(data)
                ? data
                : data.students || data.records || [];

            displayStudents(students);

            showMessage(
                "localMessage",
                "Student records loaded successfully.",
                "success"
            );

        } catch (error) {

            table.innerHTML =
                '<tr><td colspan="7">Unable to load records.</td></tr>';

            showMessage(
                "localMessage",
                "Error loading students: " + error.message,
                "error"
            );
        }
    }


    // DISPLAY STUDENTS
    function displayStudents(data) {

        const table = document.getElementById("studentTable");

        if (!data.length) {
            table.innerHTML =
                '<tr><td colspan="7">No student records found.</td></tr>';
            return;
        }

        table.innerHTML = data.map(student => `

            <tr>
                <td>${escapeHTML(student.id)}</td>
                <td>${escapeHTML(student.student_id)}</td>
                <td>${escapeHTML(student.name)}</td>
                <td>${escapeHTML(student.program)}</td>
                <td>${escapeHTML(student.year)}</td>
                <td>${escapeHTML(student.section)}</td>

                <td>
                    <button class="view"
                        onclick="viewStudent(${Number(student.id)})">
                        View
                    </button>

                    <button class="edit"
                        onclick="editStudent(${Number(student.id)})">
                        Edit
                    </button>

                    <button class="delete"
                        onclick="deleteStudent(${Number(student.id)})">
                        Delete
                    </button>
                </td>
            </tr>

        `).join("");
    }


    // ADD OR UPDATE STUDENT
    document.getElementById("studentForm")
        .addEventListener("submit", async function(event) {

        event.preventDefault();

        const id = document.getElementById("recordId").value;

        const student = {

            student_id: document.getElementById("student_id").value,
            name: document.getElementById("name").value,
            program: document.getElementById("program").value,
            year: Number(document.getElementById("year").value),
            section: document.getElementById("section").value

        };

        try {

            const url = id
                ? `/api/students/${id}`
                : "/api/students";

            const method = id ? "PUT" : "POST";

            const response = await fetch(url, {

                method: method,

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(student)

            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "Unable to save student.");
            }

            showMessage(
                "formMessage",
                id
                    ? "Student updated successfully!"
                    : "Student added successfully!",
                "success"
            );

            resetForm();
            await loadStudents();

        } catch (error) {

            showMessage(
                "formMessage",
                error.message,
                "error"
            );

        }

    });


    // VIEW STUDENT
    function viewStudent(id) {

        const student = students.find(
            item => Number(item.id) === id
        );

        if (!student) return;

        alert(
            "STUDENT DETAILS\n\n" +
            "ID: " + student.id + "\n" +
            "Student ID: " + student.student_id + "\n" +
            "Name: " + student.name + "\n" +
            "Program: " + student.program + "\n" +
            "Year: " + student.year + "\n" +
            "Section: " + student.section
        );
    }


    // EDIT STUDENT
    function editStudent(id) {

        const student = students.find(
            item => Number(item.id) === id
        );

        if (!student) return;

        document.getElementById("recordId").value = student.id;

        document.getElementById("student_id").value =
            student.student_id;

        document.getElementById("name").value =
            student.name;

        document.getElementById("program").value =
            student.program;

        document.getElementById("year").value =
            student.year;

        document.getElementById("section").value =
            student.section;

        document.getElementById("formTitle").textContent =
            "Edit Student Record";

        document.getElementById("submitButton").textContent =
            "Update Student";

        document.getElementById("cancelButton").hidden = false;

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    // DELETE STUDENT
    async function deleteStudent(id) {

        if (!confirm("Are you sure you want to delete this student?")) {
            return;
        }

        try {

            const response = await fetch(
                `/api/students/${id}`,
                { method: "DELETE" }
            );

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "Delete failed.");
            }

            showMessage(
                "localMessage",
                "Student deleted successfully!",
                "success"
            );

            await loadStudents();

        } catch (error) {

            showMessage(
                "localMessage",
                error.message,
                "error"
            );

        }

    }


    // RESET FORM
    function resetForm() {

        document.getElementById("studentForm").reset();

        document.getElementById("recordId").value = "";

        document.getElementById("formTitle").textContent =
            "Add Student Record";

        document.getElementById("submitButton").textContent =
            "Add Student";

        document.getElementById("cancelButton").hidden = true;

    }


    // SEARCH STUDENTS
    document.getElementById("searchInput")
        .addEventListener("input", function() {

        const keyword = this.value.toLowerCase().trim();

        const filtered = students.filter(student => {

            return [
                student.id,
                student.student_id,
                student.name,
                student.program,
                student.year,
                student.section
            ].some(value =>
                String(value ?? "").toLowerCase().includes(keyword)
            );

        });

        displayStudents(filtered);

    });


    // RETRIEVE CLASSMATE RECORDS
    async function loadClassmateRecords() {

        const table = document.getElementById("classmateTable");

        const baseURL = document.getElementById("classmateURL")
            .value.trim().replace(/\/+$/, "");

        if (!baseURL) {

            showMessage(
                "remoteMessage",
                "Please enter your classmate's API URL.",
                "error"
            );

            return;
        }

        table.innerHTML =
            '<tr><td colspan="6">Retrieving records...</td></tr>';

        try {

            const apiURL = baseURL + "/api/students";

            const response = await fetch(apiURL);

            if (!response.ok) {
                throw new Error(
                    "Classmate API returned HTTP " + response.status
                );
            }

            const data = await response.json();

            const records = Array.isArray(data)
                ? data
                : data.students || data.records || [];

            if (!Array.isArray(records)) {
                throw new Error("Invalid API response format.");
            }

            if (!records.length) {

                table.innerHTML =
                    '<tr><td colspan="6">No classmate records found.</td></tr>';

            } else {

                table.innerHTML = records.map(student => `

                    <tr>
                        <td>${escapeHTML(student.id)}</td>
                        <td>${escapeHTML(student.student_id)}</td>
                        <td>${escapeHTML(student.name)}</td>
                        <td>${escapeHTML(student.program)}</td>
                        <td>${escapeHTML(student.year)}</td>
                        <td>${escapeHTML(student.section)}</td>
                    </tr>

                `).join("");

            }

            showMessage(
                "remoteMessage",
                "Classmate records retrieved successfully!",
                "success"
            );

        } catch (error) {

            table.innerHTML =
                '<tr><td colspan="6">Unable to load records.</td></tr>';

            showMessage(
                "remoteMessage",
                "Unable to retrieve classmate API: " + error.message,
                "error"
            );

        }

    }


    // LOAD RECORDS WHEN PAGE OPENS
    document.addEventListener("DOMContentLoaded", loadStudents);

</script>

</body>
</html>
